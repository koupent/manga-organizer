name: Windows インストーラ

# インストーラを Windows ランナーで作り、黙って入れて同梱のサイドカーが
# 起動し、保存まで通るかを確かめる。v で始まるタグのときだけ、配布用の公開
# リポジトリ（koupent/manga-organizer-releases）へ、インストーラと自動更新の
# 案内（latest.json）を載せる。lint・テストは ci.yml が受け持つ。
#
# PR では配布物の作り方に関わる変更のときだけ走らせる。Windows ランナーは
# 分数が 2 倍に数えられ、画面だけの変更は Merge Gate で足りるため。
# 手動実行はタグを打つ前にインストーラを試すためのもので、Artifacts に
# 残すだけで Release は作らない。
on:
  pull_request:
    paths:
      - apps/desktop/src-tauri/**
      - apps/desktop/package.json
      - apps/desktop/package-lock.json
      - services/core/src/manga_api/__main__.py
      - services/core/manga_api.spec
      - services/core/pyproject.toml
      - services/core/uv.lock
      - scripts/build_sidecar.sh
      - scripts/smoke_saves.py
      - .github/workflows/release.yml
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: インストーラを作って確かめる
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      asset: ${{ steps.version.outputs.asset }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # インストーラに刻まれるのは tauri.conf.json の版。他の宣言と食い違った
      # まま、またはタグと違う名前で配らない
      - name: 版の宣言を突き合わせる
        id: version
        run: |
          set -Eeuo pipefail
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          desktop_version=$(node -p "require('./apps/desktop/package.json').version")
          cargo_version=$(sed -n '/^\[package\]/,/^\[/{s/^version = "\([^"]*\)"$/\1/p}' apps/desktop/src-tauri/Cargo.toml)
          core_version=$(sed -n '/^\[project\]/,/^\[/{s/^version = "\([^"]*\)"$/\1/p}' services/core/pyproject.toml)
          echo "tauri=$version package=$desktop_version cargo=$cargo_version core=$core_version"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$desktop_version" == "$version" ]]
          [[ "$cargo_version" == "$version" ]]
          [[ "$core_version" == "$version" ]]
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]]
          fi
          echo "asset=MangaOrganizer-v$version-setup.exe" >> "$GITHUB_OUTPUT"

      # beforeBuildCommand が画面のビルドとサイドカーの PyInstaller を行う。
      # その中の bash が Git Bash を指すよう、この手順は bash で動かす。
      # 自動更新の署名（.sig）はここでだけ作る。手元の tauri build は鍵が
      # 無くても通るよう、tauri.conf.json では有効にしない
      - name: インストーラを作る
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "自動更新の署名鍵（Secrets の TAURI_SIGNING_PRIVATE_KEY）がありません" >&2
            exit 1
          fi
          npm ci
          npx tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: 配布物の名前を揃える
        env:
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          set -Eeuo pipefail
          mkdir -p out
          cp apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe "out/$ASSET"
          # 署名はインストーラの中身に対するもので、名前を変えても効く
          cp apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig "out/$ASSET.sig"
          ls -l out

      - name: 黙って入れて、同梱のサイドカーが応答するか確かめる
        shell: pwsh
        env:
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'manga-organizer'
          Start-Process -FilePath "out\$env:ASSET" -ArgumentList '/S', "/D=$dir" -Wait

          $exe = Join-Path $dir 'resources\sidecar\manga-api.exe'
          if (-not (Test-Path $exe)) {
            Get-ChildItem -Recurse -Depth 2 $dir | Select-Object -ExpandProperty FullName
            throw "同梱のサイドカーが見つかりません: $exe"
          }

          $state = Join-Path $env:RUNNER_TEMP 'manga-organizer-state'
          $out = Join-Path $env:RUNNER_TEMP 'sidecar.out'
          $err = Join-Path $env:RUNNER_TEMP 'sidecar.err'
          New-Item -ItemType Directory -Force $state | Out-Null
          $sidecar = Start-Process -FilePath $exe -ArgumentList '--state-dir', $state `
            -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -NoNewWindow
          try {
            $ready = $null
            for ($i = 0; $i -lt 120 -and -not $ready; $i++) {
              Start-Sleep -Seconds 1
              $ready = Select-String -Path $out -Pattern '^MANGA_API_READY (.+)$' -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if (-not $ready -and $sidecar.HasExited) { break }
            }
            if (-not $ready) {
              Get-Content $err -ErrorAction SilentlyContinue
              throw 'サイドカーが READY を出しませんでした'
            }
            $connection = $ready.Matches[0].Groups[1].Value | ConvertFrom-Json
            $health = Invoke-RestMethod "http://$($connection.host):$($connection.port)/api/health?token=$($connection.token)"
            if ($health.status -ne 'ok') { throw "サイドカーの応答が想定外です: $($health | ConvertTo-Json -Compress)" }
            Write-Host "サイドカーは応答しました: $($health | ConvertTo-Json -Compress)"
          } finally {
            Stop-Process -Id $sidecar.Id -Force -ErrorAction SilentlyContinue
          }

      # 単体のテストは Python のソースを直に動かす。凍結したサイドカーを Tauri と
      # 同じ条件で起こしたときにだけ起きる不具合（Windows での保存の失敗など）は、
      # 配る物そのもので保存まで通して確かめる
      - name: 入れたサイドカーで、並べ替え・分割・サムネイルの保存が通るか確かめる
        run: |
          set -Eeuo pipefail
          uv run --no-project python scripts/smoke_saves.py "$RUNNER_TEMP/manga-organizer/resources/sidecar/manga-api.exe"

      # 同梱の場所の取り違えや終了時の後始末は、アプリ本体を通さないと分からない
      - name: 入れたアプリがサイドカーを起こし、閉じると止めるか確かめる
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'manga-organizer'
          $log = Join-Path $env:APPDATA 'dev.koupent.manga-organizer\sidecar.log'
          $app = Get-ChildItem $dir -Filter '*.exe' | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          $proc = Start-Process -FilePath $app.FullName -PassThru
          try {
            $sidecar = $null
            for ($i = 0; $i -lt 120 -and -not $sidecar; $i++) {
              Start-Sleep -Seconds 1
              $sidecar = Get-Process manga-api -ErrorAction SilentlyContinue |
                Where-Object { $_.Path -like "$dir*" } | Select-Object -First 1
            }
            if (-not $sidecar) {
              Get-Content $log -ErrorAction SilentlyContinue
              throw "$($app.Name) が同梱のサイドカーを起動しませんでした"
            }
            Write-Host "サイドカーが起動しました: $($sidecar.Path)"

            for ($i = 0; $i -lt 30 -and $proc.MainWindowHandle -eq 0; $i++) {
              Start-Sleep -Seconds 1
              $proc.Refresh()
            }
            if (-not $proc.CloseMainWindow()) { throw 'ウィンドウを閉じられませんでした' }
            if (-not $proc.WaitForExit(30000)) { throw 'ウィンドウを閉じてもアプリが終わりませんでした' }
            if (-not $sidecar.WaitForExit(10000)) { throw 'アプリを閉じてもサイドカーが残りました' }
            Write-Host 'アプリを閉じるとサイドカーも止まりました'
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Get-Process manga-api -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.asset }}
          path: |
            out/${{ steps.version.outputs.asset }}
            out/${{ steps.version.outputs.asset }}.sig
          if-no-files-found: error

  # 配布用の公開リポジトリへ載せる。書き込みには、そのリポジトリだけに
  # 書けるトークン（Secrets の RELEASES_TOKEN）を使う。ソースの private
  # リポジトリには Release を作らない（置き場を 1 つにする）
  release:
    name: GitHub Release に載せる
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_REPO: koupent/manga-organizer-releases
    steps:
      # 変更点は前のタグからのコミットの題名で作る。履歴を全部取る
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.asset }}
          path: out

      # アプリはこの latest.json を読んで新しい版を知る（tauri.conf.json の
      # plugins.updater.endpoints が releases/latest/download/latest.json を指す）
      - name: 自動更新の案内（latest.json）を作る
        env:
          ASSET: ${{ needs.build.outputs.asset }}
        run: |
          set -Eeuo pipefail
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [[ -n "$previous" ]]; then
            git log --no-merges --format='- %s' "$previous..$GITHUB_REF_NAME" > out/notes.md
          else
            echo "- 最初の版" > out/notes.md
          fi
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --rawfile notes out/notes.md \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile signature "out/$ASSET.sig" \
            --arg url "https://github.com/$PUBLIC_REPO/releases/download/$GITHUB_REF_NAME/$ASSET" \
            '{version: $version, notes: $notes, pub_date: $pub_date,
              platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' \
            > out/latest.json
          cat out/latest.json

      - name: Release を作る
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          ASSET: ${{ needs.build.outputs.asset }}
        run: |
          set -Eeuo pipefail
          {
            echo "## 入れ方"
            echo
            echo "1. 下の Assets から \`$ASSET\` をダウンロードして実行します。"
            echo "2. 「Windows によって PC が保護されました」と出たら「詳細情報」→「実行」を押します（署名していないために出る警告です）。"
            echo "3. 終わるとスタートメニューに「Manga Organizer」が入ります。"
            echo
            echo "v4.1.0 以降を入れてあれば、次の版からはアプリが知らせて、そのまま更新できます。RAR / CBR を扱うときだけ 7-Zip が要ります。"
            echo
            echo "## 変更点"
            echo
            cat out/notes.md
          } > out/body.md
          gh release create "$GITHUB_REF_NAME" "out/$ASSET" out/latest.json \
            --repo "$PUBLIC_REPO" \
            --title "Manga Organizer $GITHUB_REF_NAME" \
            --notes-file out/body.md
