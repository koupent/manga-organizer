<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページ修正</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1c1f26;
    --panel-hover: #232733;
    --border: #2e3341;
    --text: #e7eaf0;
    --muted: #98a0b0;
    --accent: #5b8cff;
    --accent-soft: rgba(91, 140, 255, 0.16);
    --danger: #ff6b6b;
    --card-width: 220px;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", system-ui, sans-serif;
    font-size: 14px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .title { display: flex; flex-direction: column; min-width: 0; }
  .title strong { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title span { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1 1 auto; }
  .size-control { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  input[type="range"] { width: 150px; accent-color: var(--accent); }
  button {
    font: inherit;
    color: var(--text);
    background: var(--panel-hover);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover:not(:disabled) { background: #2c3240; border-color: #3c4354; }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0b1020; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #6f9bff; border-color: #6f9bff; }
  .hint {
    flex: 0 0 auto;
    padding: 8px 18px;
    color: var(--muted);
    font-size: 12px;
    border-bottom: 1px solid var(--border);
    background: #171a20;
  }
  .hint kbd {
    background: var(--panel-hover);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    font-family: inherit;
    font-size: 11px;
  }
  #grid {
    flex: 1 1 auto;
    overflow-y: auto;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 14px;
    padding: 18px;
  }
  .card {
    width: var(--card-width);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: grab;
    user-select: none;
    position: relative;
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  .card:hover { border-color: #414a5e; }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .card.dragging { opacity: 0.35; }
  .card.drop-before::before,
  .card.drop-after::after {
    content: "";
    position: absolute;
    top: 4px;
    bottom: 4px;
    width: 3px;
    border-radius: 2px;
    background: var(--accent);
  }
  .card.drop-before::before { left: -9px; }
  .card.drop-after::after { right: -9px; }
  .thumb {
    width: 100%;
    aspect-ratio: 2 / 3;
    background: #0f1116;
    display: block;
    object-fit: contain;
    pointer-events: none;
  }
  .meta {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 9px;
    border-top: 1px solid var(--border);
  }
  .position {
    flex: 0 0 auto;
    min-width: 30px;
    text-align: center;
    background: var(--panel-hover);
    border-radius: 5px;
    padding: 2px 5px;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 12px;
  }
  .card.moved .position { background: var(--accent); color: #0b1020; }
  .label {
    flex: 1 1 auto;
    color: var(--muted);
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .zoom {
    flex: 0 0 auto;
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 2px 4px;
    font-size: 13px;
    cursor: zoom-in;
  }
  .zoom:hover { color: var(--text); background: transparent; }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 10, 14, 0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    z-index: 10;
    white-space: pre-line;
    text-align: center;
  }
  .overlay[hidden] { display: none; }
  .overlay img { max-width: 92vw; max-height: 84vh; border-radius: 6px; }
  .overlay .caption { color: var(--muted); font-size: 12px; }
  #status { color: var(--muted); font-size: 12px; }
  #status.error { color: var(--danger); }
</style>
</head>
<body>
<header>
  <div class="title">
    <strong id="archive-name">読み込み中...</strong>
    <span id="archive-meta">読み込み中...</span>
  </div>
  <div class="spacer"></div>
  <span id="status"></span>
  <div class="size-control">
    <span>表示サイズ</span>
    <input type="range" id="size" min="140" max="520" step="20" value="220">
  </div>
  <button id="reset">並びをリセット</button>
  <button id="cancel">キャンセル</button>
  <button id="save" class="primary" disabled>ZIP に保存</button>
</header>

<div class="hint">
  カードをドラッグして順番を入れ替えます ・ <kbd>Ctrl</kbd>/<kbd>Shift</kbd>+クリックで複数選択してまとめて移動 ・
  <kbd>Ctrl</kbd>+<kbd>←</kbd>/<kbd>→</kbd> で 1 つずつ移動 ・ <kbd>Ctrl</kbd>+<kbd>Z</kbd> で元に戻す ・ 🔍 で原寸表示
</div>

<div id="grid"></div>

<div class="overlay" id="lightbox" hidden>
  <img id="lightbox-image" alt="">
  <div class="caption" id="lightbox-caption"></div>
  <button id="lightbox-close">閉じる (Esc)</button>
</div>

<div class="overlay" id="busy" hidden>
  <div id="busy-text">保存しています...</div>
</div>

<script>
(() => {
  "use strict";

  const TOKEN = "__TOKEN__";
  const HEARTBEAT_INTERVAL_MS = 15000;
  const MAX_HISTORY = 100;

  const api = (path, params = {}) => {
    const url = new URL(path, window.location.origin);
    url.searchParams.set("token", TOKEN);
    for (const [key, value] of Object.entries(params)) {
      url.searchParams.set(key, value);
    }
    return url.toString();
  };

  const grid = document.getElementById("grid");
  const statusLabel = document.getElementById("status");
  const saveButton = document.getElementById("save");
  const sizeSlider = document.getElementById("size");
  const busy = document.getElementById("busy");
  const busyText = document.getElementById("busy-text");

  const state = {
    pages: new Map(),
    originalOrder: [],
    order: [],
    thumbnailWidths: [240],
    selection: new Set(),
    lastClicked: null,
    history: [],
    saving: false,
  };
  const cardElements = new Map();

  const setStatus = (text, kind = "") => {
    statusLabel.textContent = text;
    statusLabel.className = kind;
  };

  const isDirty = () =>
    state.order.length !== state.originalOrder.length ||
    state.order.some((name, index) => name !== state.originalOrder[index]);

  const pushHistory = () => {
    state.history.push([...state.order]);
    if (state.history.length > MAX_HISTORY) state.history.shift();
  };

  const pickThumbnailWidth = (displayWidth) => {
    const scaled = displayWidth * (window.devicePixelRatio || 1);
    return state.thumbnailWidths.find((width) => scaled <= width) ??
      state.thumbnailWidths[state.thumbnailWidths.length - 1];
  };

  const openLightbox = (page) => {
    document.getElementById("lightbox-image").src = api("/api/image", { name: page.name });
    document.getElementById("lightbox-caption").textContent =
      `${page.label} ・ ${page.modified} ・ ${(page.size / 1024).toFixed(0)} KB`;
    document.getElementById("lightbox").hidden = false;
  };

  const closeLightbox = () => {
    const lightbox = document.getElementById("lightbox");
    lightbox.hidden = true;
    document.getElementById("lightbox-image").removeAttribute("src");
  };

  const buildCard = (page) => {
    const card = document.createElement("div");
    card.className = "card";
    card.draggable = true;
    card.dataset.name = page.name;

    const image = document.createElement("img");
    image.className = "thumb";
    image.loading = "lazy";
    image.decoding = "async";
    image.alt = page.label;
    image.src = api("/api/thumb", {
      name: page.name,
      width: pickThumbnailWidth(Number(sizeSlider.value)),
    });

    const meta = document.createElement("div");
    meta.className = "meta";

    const position = document.createElement("span");
    position.className = "position";

    const label = document.createElement("span");
    label.className = "label";
    label.textContent = page.label;
    label.title = `${page.label} ・ ${page.modified}`;

    const zoom = document.createElement("button");
    zoom.className = "zoom";
    zoom.type = "button";
    zoom.textContent = "🔍";
    zoom.title = "原寸で表示";
    zoom.addEventListener("click", (event) => {
      event.stopPropagation();
      openLightbox(page);
    });

    meta.append(position, label, zoom);
    card.append(image, meta);
    return card;
  };

  const refreshThumbnails = () => {
    const width = pickThumbnailWidth(Number(sizeSlider.value));
    for (const [name, card] of cardElements) {
      const image = card.querySelector("img");
      const next = api("/api/thumb", { name, width });
      if (image.src !== next) image.src = next;
    }
  };

  const render = () => {
    const fragment = document.createDocumentFragment();
    state.order.forEach((name, index) => {
      const card = cardElements.get(name);
      card.querySelector(".position").textContent = String(index + 1);
      card.classList.toggle("selected", state.selection.has(name));
      card.classList.toggle("moved", state.originalOrder[index] !== name);
      fragment.append(card);
    });
    grid.append(fragment);
    saveButton.disabled = state.saving || !isDirty();
    if (!state.saving) setStatus(isDirty() ? "未保存の変更があります" : "");
  };

  const selectCard = (name, event) => {
    if (event.shiftKey && state.lastClicked) {
      const from = state.order.indexOf(state.lastClicked);
      const to = state.order.indexOf(name);
      const [start, end] = from < to ? [from, to] : [to, from];
      state.selection = new Set(state.order.slice(start, end + 1));
    } else if (event.ctrlKey || event.metaKey) {
      if (state.selection.has(name)) state.selection.delete(name);
      else state.selection.add(name);
      state.lastClicked = name;
    } else {
      state.selection = new Set([name]);
      state.lastClicked = name;
    }
    render();
  };

  grid.addEventListener("click", (event) => {
    const card = event.target.closest(".card");
    if (!card) {
      state.selection.clear();
      render();
      return;
    }
    selectCard(card.dataset.name, event);
  });

  let dragged = [];

  const clearDropMarkers = () => {
    for (const card of cardElements.values()) {
      card.classList.remove("drop-before", "drop-after");
    }
  };

  const moveNames = (names, targetIndex) => {
    const moving = new Set(names);
    const anchor = state.order[targetIndex] ?? null;
    // 選択範囲の内側へ落とした場合、その位置は取り除いた後には存在しない。
    // 「動かさない」が期待される挙動なのでここで打ち切る。
    if (anchor !== null && moving.has(anchor)) return;
    const remaining = state.order.filter((name) => !moving.has(name));
    const ordered = state.order.filter((name) => moving.has(name));
    const insertAt = anchor === null ? remaining.length : remaining.indexOf(anchor);
    const position = insertAt < 0 ? remaining.length : insertAt;
    pushHistory();
    state.order = [
      ...remaining.slice(0, position),
      ...ordered,
      ...remaining.slice(position),
    ];
    render();
  };

  grid.addEventListener("dragstart", (event) => {
    const card = event.target.closest(".card");
    if (!card) return;
    const name = card.dataset.name;
    if (!state.selection.has(name)) {
      state.selection = new Set([name]);
      state.lastClicked = name;
      render();
    }
    dragged = state.order.filter((item) => state.selection.has(item));
    card.classList.add("dragging");
    event.dataTransfer.effectAllowed = "move";
    event.dataTransfer.setData("text/plain", name);
  });

  grid.addEventListener("dragend", () => {
    dragged = [];
    clearDropMarkers();
    for (const card of cardElements.values()) card.classList.remove("dragging");
  });

  grid.addEventListener("dragover", (event) => {
    if (dragged.length === 0) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = "move";
    clearDropMarkers();
    const card = event.target.closest(".card");
    if (!card) return;
    const bounds = card.getBoundingClientRect();
    card.classList.add(event.clientX > bounds.left + bounds.width / 2 ? "drop-after" : "drop-before");
  });

  grid.addEventListener("drop", (event) => {
    if (dragged.length === 0) return;
    event.preventDefault();
    const card = event.target.closest(".card");
    let targetIndex = state.order.length;
    if (card) {
      const bounds = card.getBoundingClientRect();
      const after = event.clientX > bounds.left + bounds.width / 2;
      targetIndex = state.order.indexOf(card.dataset.name) + (after ? 1 : 0);
    }
    clearDropMarkers();
    moveNames(dragged, targetIndex);
    dragged = [];
  });

  const nudgeSelection = (offset) => {
    if (state.selection.size === 0) return;
    const moving = state.order.filter((name) => state.selection.has(name));
    const first = state.order.indexOf(moving[0]);
    const last = state.order.indexOf(moving[moving.length - 1]);
    const target = offset < 0 ? first - 1 : last + 2;
    if (target < 0 || target > state.order.length) return;
    moveNames(moving, target);
  };

  document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
  document.getElementById("lightbox").addEventListener("click", (event) => {
    if (event.target.id === "lightbox") closeLightbox();
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") { closeLightbox(); return; }
    if (!(event.ctrlKey || event.metaKey)) return;
    if (event.key === "z") {
      event.preventDefault();
      const previous = state.history.pop();
      if (previous) { state.order = previous; render(); }
    } else if (event.key === "ArrowLeft") {
      event.preventDefault();
      nudgeSelection(-1);
    } else if (event.key === "ArrowRight") {
      event.preventDefault();
      nudgeSelection(1);
    }
  });

  sizeSlider.addEventListener("input", () => {
    document.documentElement.style.setProperty("--card-width", `${sizeSlider.value}px`);
  });
  sizeSlider.addEventListener("change", refreshThumbnails);

  document.getElementById("reset").addEventListener("click", () => {
    pushHistory();
    state.order = [...state.originalOrder];
    render();
  });

  const finishAndClose = (message) => {
    busyText.textContent = `${message}\nこのウィンドウは閉じて構いません。`;
    busy.hidden = false;
    setTimeout(() => window.close(), 1200);
  };

  document.getElementById("cancel").addEventListener("click", async () => {
    if (isDirty() && !window.confirm("未保存の変更を破棄しますか?")) return;
    await fetch(api("/api/cancel"), { method: "POST" });
    finishAndClose("編集を取り消しました。");
  });

  saveButton.addEventListener("click", async () => {
    state.saving = true;
    saveButton.disabled = true;
    busyText.textContent = "保存しています...";
    busy.hidden = false;
    try {
      const response = await fetch(api("/api/save"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ order: state.order }),
      });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error ?? "保存に失敗しました");
      state.originalOrder = [...state.order];
      finishAndClose(payload.message);
    } catch (error) {
      busy.hidden = true;
      state.saving = false;
      saveButton.disabled = false;
      setStatus(String(error.message ?? error), "error");
    }
  });

  const load = async () => {
    const response = await fetch(api("/api/pages"));
    if (!response.ok) { setStatus("ページ一覧を取得できませんでした", "error"); return; }
    const payload = await response.json();
    state.thumbnailWidths = payload.thumbnailWidths;
    state.originalOrder = payload.pages.map((page) => page.name);
    state.order = [...state.originalOrder];
    for (const page of payload.pages) {
      state.pages.set(page.name, page);
      cardElements.set(page.name, buildCard(page));
    }
    document.getElementById("archive-name").textContent = payload.archive;
    document.title = `ページ修正 - ${payload.archive}`;
    document.getElementById("archive-meta").textContent =
      `${payload.pages.length} ページ ・ ${payload.archivePath}`;
    render();
  };

  setInterval(() => { fetch(api("/api/ping")).catch(() => {}); }, HEARTBEAT_INTERVAL_MS);

  window.addEventListener("beforeunload", (event) => {
    if (isDirty() && !state.saving) event.preventDefault();
  });

  load().catch((error) => setStatus(String(error), "error"));
})();
</script></body></html>
