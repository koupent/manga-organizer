[project]
name = "manga-core"
version = "4.7.0"
description = "漫画アーカイブの整理とページ順修正を担う GUI 非依存のコアロジック"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pillow>=11.3.0",
    "py7zr>=0.20.0",
    "rarfile>=4.0",
    "requests>=2.31.0",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.0",
    "httpx>=0.27.0",
    "pyinstaller>=6.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manga_core", "src/manga_api"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
