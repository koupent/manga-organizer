[project]
name = "manga-organizer"
version = "3.8.2"
description = "Automatic manga archive organizer with intelligent volume detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=11.3.0",
    "py7zr>=0.20.0",
    "tkinterdnd2>=0.3.0",
    "requests>=2.31.0",
    "nuitka>=2.7.12",
    "pyinstaller>=6.15.0",
    "rarfile>=4.0",
    "manga-core",
]

[tool.uv.sources]
# コアは services/core に切り出した。撤去までは現行アプリもここを参照する
manga-core = { path = "../services/core", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.12.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
