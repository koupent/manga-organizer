[package]
name = "manga-organizer-desktop"
version = "4.3.0"
description = "漫画アーカイブの整理とページ順修正を行うデスクトップアプリ"
edition = "2021"
rust-version = "1.77"

[lib]
name = "manga_organizer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "~2.12.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
