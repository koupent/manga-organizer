[supervisord]
; Run as a daemon so postStart can exit cleanly
;nodaemon=false
user=node
logfile=/tmp/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/tmp/supervisord.pid
directory=/workspace

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

# Xvfb - Virtual display server
[program:xvfb]
command=Xvfb :0 -screen 0 %(ENV_DISPLAY_WIDTH)sx%(ENV_DISPLAY_HEIGHT)sx24
autorestart=true
user=node
priority=100
environment=DISPLAY_WIDTH="%(ENV_DISPLAY_WIDTH)s",DISPLAY_HEIGHT="%(ENV_DISPLAY_HEIGHT)s"

# x11vnc - VNC server
[program:x11vnc]
command=x11vnc -forever -shared -display :0 -rfbport 5900 -nopw
autorestart=true
user=node
priority=200
environment=DISPLAY=":0"

# websockify - WebSocket to VNC proxy
[program:websockify]
command=websockify --web /usr/share/novnc %(ENV_NOVNC_PORT)s localhost:5900
autorestart=true
user=node
priority=300

# Fluxbox - Window manager
[program:fluxbox]
command=fluxbox
autorestart=true
user=node
priority=400
environment=HOME="/home/node",USER="node",DISPLAY=":0"
