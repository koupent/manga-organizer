name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # Allow manual trigger for testing

permissions:
  contents: write  # Allow creating releases and uploading assets

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: manga-organizer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install dependencies
        run: |
          uv sync
          uv pip install pyinstaller

      - name: Get version
        id: get_version
        shell: powershell
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); from __version__ import __version__; print(__version__)"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"

      - name: Download 7za.exe standalone version
        shell: powershell
        run: |
          # Create resources directory
          New-Item -ItemType Directory -Force -Path "resources/7zip"

          # Download 7-Zip Extra (contains standalone 7za.exe)
          $url = "https://www.7-zip.org/a/7z2501-extra.7z"
          $output = "7z-extra.7z"

          Write-Host "Downloading 7-Zip Extra (for standalone 7za.exe)..."
          Invoke-WebRequest -Uri $url -OutFile $output

          # Check if 7z is available for extraction
          if (Get-Command 7z -ErrorAction SilentlyContinue) {
              Write-Host "Extracting with 7z..."
              7z x $output -o"temp_7zip" -y

              # List extracted files to understand structure
              Write-Host "Extracted files:"
              Get-ChildItem -Recurse "temp_7zip" | Select-Object Name, Directory

              # Find and copy 7za.exe (standalone version)
              $standalone = Get-ChildItem -Recurse "temp_7zip" -Filter "7za.exe" | Select-Object -First 1

              if ($standalone) {
                  Copy-Item $standalone.FullName "resources/7zip/7za.exe"
                  Write-Host "7za.exe standalone version prepared successfully"
                  Write-Host "Path: resources/7zip/7za.exe"

                  # Verify the file
                  $fileInfo = Get-Item "resources/7zip/7za.exe"
                  Write-Host "File size: $($fileInfo.Length) bytes"
              } else {
                  Write-Host "Warning: Could not find 7za.exe in extracted files"
              }

              # Clean up
              Remove-Item -Recurse -Force "temp_7zip"
              Remove-Item $output
          } else {
              Write-Host "Warning: Cannot extract 7-Zip files (7z not available)"
              Write-Host "RAR support will depend on user's system"
          }
        continue-on-error: true

      - name: Build executable with PyInstaller
        shell: powershell
        run: |
          # Build using spec file if it exists, otherwise use command line
          if (Test-Path "MangaOrganizer.spec") {
              Write-Host "Building with spec file..."
              uv run pyinstaller MangaOrganizer.spec
          } else {
              Write-Host "Building with command line..."
              $version = "${{ steps.get_version.outputs.VERSION }}"
              uv run pyinstaller --onefile --noconsole --windowed `
                --name "MangaOrganizer-v$version" `
                --paths src `
                --hidden-import rarfile `
                src/main.py
          }

          # List built files
          Write-Host "Built files:"
          Get-ChildItem dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaOrganizer-Windows
          path: manga-organizer/dist/*.exe
          retention-days: 30

      - name: Extract changelog for release notes
        id: changelog
        shell: powershell
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          $changelog = Get-Content "CHANGELOG.md" -Raw

          # Extract section for current version
          $pattern = "## Version $version[^\#]*"
          if ($changelog -match $pattern) {
              $notes = $matches[0]
              # Remove the version header line
              $notes = $notes -replace "## Version $version.*\n", ""
              # Escape for GitHub Actions
              $notes = $notes -replace '%', '%25'
              $notes = $notes -replace '\n', '%0A'
              $notes = $notes -replace '\r', '%0D'
              echo "NOTES=$notes" >> $env:GITHUB_OUTPUT
          } else {
              echo "NOTES=See CHANGELOG.md for details" >> $env:GITHUB_OUTPUT
          }

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: manga-organizer/dist/*.exe
          name: Release v${{ steps.get_version.outputs.VERSION }}
          body: |
            # Manga Organizer v${{ steps.get_version.outputs.VERSION }}

            ${{ steps.changelog.outputs.NOTES }}

            ## Download

            Download the executable below and run it on Windows.

            ### Requirements
            - Windows 10 or later
            - Optional: 7-Zip for better RAR support

            ### Installation
            1. Download `MangaOrganizer-v${{ steps.get_version.outputs.VERSION }}.exe`
            2. Place it in your desired folder
            3. Run the executable

            See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for usage instructions.
          draft: false
          prerelease: false
          generate_release_notes: false
